spring.application.name=notes_projeto
spring.datasource.url=jdbc:postgresql://localhost:5432/projeto_notes
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create-drop

# DevTools: reinicia a app quando target/classes muda
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
spring.devtools.livereload.enabled=true

spring.config.import=optional:file:.env[.properties]
# minio
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.region=${S3_REGION:us-west-1}
s3.access-key=${S3_ACCESS_KEY:access_key}
s3.secret-key=${S3_SECRET_KEY:access_key}
s3.bucket=${S3_BUCKET:notes}
