spring.application.name=notes_projeto
spring.datasource.url=jdbc:postgresql://localhost:5432/projeto_notes
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create-drop

# DevTools: reinicia a app quando target/classes muda
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
spring.devtools.livereload.enabled=true

spring.config.import=optional:file:.env[.properties]
# minio
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.region=${S3_REGION:us-west-1}
s3.access-key=${S3_ACCESS_KEY:access_key}
s3.secret-key=${S3_SECRET_KEY:access_key}
s3.bucket=${S3_BUCKET:notes}

# upload: limite de 5MB por arquivo (o padrão do Spring é 1MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# deixa o Tomcat ler o corpo inteiro de uploads rejeitados, senão ele derruba a
# conexão (acima de 2MB) e o cliente recebe "connection reset" em vez do 413
server.tomcat.max-swallow-size=-1

# CORS: origens liberadas, separadas por vírgula
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
